<!doctype html>
<html lang="es" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Página no encontrada (404) | Centro Amaré</title>
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <style>
      :root {
        --color-plum-900: #22284A;
        --color-clay: #AA5A40;
        --color-canvas: #F3F0E8;
        --color-ink-secondary: #3D456E;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--color-canvas);
        color: var(--color-plum-900);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
        box-sizing: border-box;
      }
      .card {
        background: #FFFFFF;
        border-radius: 24px;
        padding: 48px 32px;
        max-width: 520px;
        box-shadow: 0 12px 32px rgba(34, 40, 74, 0.08);
      }
      h1 {
        font-size: 28px;
        margin: 0 0 12px;
        color: var(--color-plum-900);
      }
      p {
        font-size: 16px;
        line-height: 1.6;
        color: var(--color-ink-secondary);
        margin: 0 0 28px;
      }
      .btn {
        display: inline-block;
        background: var(--color-clay);
        color: #FFFFFF;
        text-decoration: none;
        padding: 14px 28px;
        border-radius: 999px;
        font-weight: 700;
        font-size: 15px;
        transition: transform 0.2s ease, background 0.2s ease;
      }
      .btn:hover {
        background: #8D4731;
        transform: translateY(-2px);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div style="font-size: 48px; margin-bottom: 12px;">🌿</div>
      <h1>Página no encontrada (404)</h1>
      <p>La página que buscas no existe o ha cambiado de lugar. Puedes volver al inicio o conocer nuestras opciones de terapia.</p>
      <a href="/" class="btn">Volver al Inicio</a>
    </div>
  </body>
</html>
